name: VietVoice 1.3 Auto Model APK
on:
  workflow_dispatch:
  push:
    branches: [vietvoice-1.3-auto-model]
    paths:
      - 'VietVoice-1.3-CI-bundle.zip'
      - '.github/workflows/build-vietvoice-1.3.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          test -f VietVoice-1.3-CI-bundle.zip
          unzip -t VietVoice-1.3-CI-bundle.zip
          unzip -oq VietVoice-1.3-CI-bundle.zip -d .
          test -f app/src/main/java/vn/ca/vietvoiceoffline/AutoModelInstaller.java
          ! grep -r -q 'com.google.mlkit' app/src/main/java app/src/main/kotlin app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore native dependencies
        run: |
          python3 tools/prepare_ci_assets_1_2.py
          base64 --decode signing/vietvoice-test.keystore.base64 > signing/vietvoice-test.keystore
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk VietVoice-AI-1.3-AutoModel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VietVoice-1.3-AutoModel-APK
          path: VietVoice-AI-1.3-AutoModel.apk
      - name: Publish personal APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.3-auto-${GITHUB_RUN_NUMBER}" VietVoice-AI-1.3-AutoModel.apk --title "VietVoice 1.3 Tự cài model" --notes "One-tap model installation, signed test build. Redmi 13C runtime verification pending."

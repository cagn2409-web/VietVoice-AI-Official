name: Build VietVoice 1.2 from source bundle
on:
  workflow_dispatch:
  push:
    paths:
      - 'VietVoice-1.2-CI-bundle.zip'
      - '.github/workflows/build-vietvoice-1.2-bundle.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require matching VietVoice 1.2 source bundle
        run: |
          test -f VietVoice-1.2-CI-bundle.zip || { echo 'Missing VietVoice-1.2-CI-bundle.zip in repository root'; exit 1; }
          unzip -t VietVoice-1.2-CI-bundle.zip
          unzip -oq VietVoice-1.2-CI-bundle.zip -d .
          test -f app/src/main/java/vn/ca/vietvoiceoffline/TenAiModules.java
          ! grep -r -q 'com.google.mlkit' app/src/main/java app/src/main/kotlin app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK and native packaging dependencies
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore binary assets with checksum checks
        run: |
          python3 tools/prepare_ci_assets_1_2.py
          base64 --decode signing/vietvoice-test.keystore.base64 > signing/vietvoice-test.keystore
      - name: Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build personal APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk VietVoice-AI-1.2-10AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VietVoice-AI-1.2-10AI-APK
          path: VietVoice-AI-1.2-10AI.apk
      - name: Publish APK as personal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.2-ci-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" VietVoice-AI-1.2-10AI.apk --title "VietVoice AI 1.2 build ${GITHUB_RUN_NUMBER}" --notes "Unofficial personal APK. Requires separately downloaded ASR, Tesseract and LiteRT-LM model. Android hardware and translation quality still need testing."

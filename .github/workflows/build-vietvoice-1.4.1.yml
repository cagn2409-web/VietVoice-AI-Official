name: VietVoice 1.4.1 Browser DNS
on:
  workflow_dispatch:
  push:
    branches: [vietvoice-1.4.1-browser-dns]
    paths:
      - 'VietVoice-1.4.1-CI-bundle.zip'
      - '.github/workflows/build-vietvoice-1.4.1.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified project
        run: |
          unzip -t VietVoice-1.4.1-CI-bundle.zip
          unzip -oq VietVoice-1.4.1-CI-bundle.zip -d .
          test -f app/src/main/java/vn/ca/vietvoiceoffline/BrowserDnsAssistant.java
          test -f app/src/test/java/vn/ca/vietvoiceoffline/BrowserDnsPolicyTest.java
          ! grep -r -q 'com.google.mlkit' app/src/main/java app/src/main/kotlin app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and native tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore native dependencies
        run: |
          python3 tools/prepare_ci_assets_1_2.py
          base64 --decode signing/vietvoice-test.keystore.base64 > signing/vietvoice-test.keystore
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build signed release
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify signature and alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk VietVoice-AI-1.4.1-Browser-DNS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VietVoice-1.4.1-Browser-DNS
          path: VietVoice-AI-1.4.1-Browser-DNS.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.4.1-dns-${GITHUB_RUN_NUMBER}" VietVoice-AI-1.4.1-Browser-DNS.apk --title "VietVoice 1.4.1 - Browser DNS Assistant" --notes "Browser DNS helper with Cloudflare and Google Android Private DNS presets, network diagnostics, video boost unchanged. Android does not permit silently changing system DNS. Test on device required."

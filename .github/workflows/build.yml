name: Diagnose APK installation
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect published APK
        run: |
          curl -fL --retry 3 -o app.apk https://github.com/cagn2409-web/VietVoice-AI-Official/releases/download/build-3/VietVoice-AI-1.0-Official.apk
          sha256sum app.apk
          unzip -t app.apk | tail -3
          SDK_TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs app.apk
          "$SDK_TOOLS/aapt" dump badging app.apk
          "$SDK_TOOLS/aapt" dump xmltree app.apk AndroidManifest.xml
          "$SDK_TOOLS/zipalign" -c -v 4 app.apk | tail -3

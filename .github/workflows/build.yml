name: Diagnose Android 15 installation
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download exact published APK
        run: curl -fL --retry 3 -o app.apk https://github.com/cagn2409-web/VietVoice-AI-Official/releases/download/build-3/VietVoice-AI-1.0-Official.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb install app.apk
            adb shell am start -W -n vn.ca.vietvoiceoffline/.MainActivity
      - name: Installation log
        if: always()
        run: adb logcat -d -s PackageManager PackageInstaller AndroidRuntime || true
